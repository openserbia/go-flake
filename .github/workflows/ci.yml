name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    # Use the same self-hosted runner as the daily refresh — it already
    # has Nix configured. Validation is read-only / network-free, so
    # there's no concern about secrets exposure on fork PRs (none would
    # run here anyway; self-hosted refuses fork-PR triggers).
    runs-on: self-hosted
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      # Pure round-trip check (parse + render must produce identical
      # bytes). Catches hand-edits that break idempotency and any
      # parser/renderer regressions. No network.
      - name: Validate versions.nix
        run: nix-shell -p python3 --run "./scripts/update-versions.py --validate"

      - name: Validate binary-mirror data files
        run: |
          nix-shell -p python3 --run '
            for t in golangci-lint goreleaser gofumpt; do
              ./scripts/update-github-tool.py --tool "$t" --validate
            done
          '

      - name: Validate source-built data files
        run: |
          nix-shell -p python3 --run '
            for t in govulncheck gopls delve staticcheck; do
              ./scripts/update-source-tool.py --tool "$t" --validate
            done
          '

      # Flake eval check across every system the flake exposes. Doesn't
      # build anything (--no-build); just walks each derivation and
      # surfaces eval errors. Source-built tools are skipped on
      # x86_64-freebsd at the flake level (upstream buildGoModule
      # infinite-recurses there), which is what lets --all-systems pass.
      #
      # `bash -el` is a login shell so /etc/profile.d/nix*.sh gets sourced
      # and `nix` lands on PATH — GitHub Actions' default `bash -e` skips
      # profile loading.
      - name: nix flake check
        shell: bash -el {0}
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
            flake check --no-build --no-warn-dirty --all-systems

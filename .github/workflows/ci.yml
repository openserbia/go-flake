name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # SECURITY: this triggers on `pull_request`, so a PR from ANY fork runs
    # PR-controlled code (./scripts/*.py, flake.nix) here. It MUST stay on
    # ephemeral GitHub-hosted ubuntu-latest — NEVER the self-hosted org pool,
    # which is shared with the rootful production build host. Self-hosted
    # runners do NOT refuse fork-PR triggers; they run them subject only to the
    # fork-PR approval gate. Standard runners are free with unlimited minutes on
    # public repos, so this costs nothing. Validation is read-only / network-
    # free; Nix is installed per-run by install-nix-action.
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Pure round-trip check (parse + render must produce identical
      # bytes). Catches hand-edits that break idempotency and any
      # parser/renderer regressions. No network.
      - name: Validate versions.nix
        run: nix develop --command ./scripts/update-versions.py --validate

      - name: Validate binary-mirror data files
        run: |
          for t in golangci-lint goreleaser gofumpt; do
            nix develop --command ./scripts/update-github-tool.py --tool "$t" --validate
          done

      - name: Validate source-built data files
        run: |
          for t in govulncheck gopls delve staticcheck; do
            nix develop --command ./scripts/update-source-tool.py --tool "$t" --validate
          done

      # Flake eval check across every system the flake exposes. Doesn't
      # build anything (--no-build); just walks each derivation and
      # surfaces eval errors. Source-built tools are skipped on
      # x86_64-freebsd at the flake level (upstream buildGoModule
      # infinite-recurses there), which is what lets --all-systems pass.
      - name: nix flake check
        run: |
          nix flake check --no-build --no-warn-dirty --all-systems

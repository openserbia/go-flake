name: Update versions

on:
  schedule:
    - cron: "0 6 * * *"  # Daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: self-hosted
    # update-source-tool.py shells out to `nix-prefetch-url` and `nix build`
    # when a new upstream version needs hashes resolved. GitHub Actions'
    # default `bash -e` doesn't source the runner's login profile, so nix
    # isn't on PATH. A login shell (`bash -el`) sources /etc/profile.d/nix*.sh
    # and unblocks those calls. No-op for the pure-Python steps.
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate versions.nix (go)
        run: ./scripts/update-versions.py

      - name: Regenerate golangci-lint-versions.nix
        run: ./scripts/update-github-tool.py --tool golangci-lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate goreleaser-versions.nix
        run: ./scripts/update-github-tool.py --tool goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate gofumpt-versions.nix
        run: ./scripts/update-github-tool.py --tool gofumpt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate govulncheck-versions.nix
        run: ./scripts/update-source-tool.py --tool govulncheck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate gopls-versions.nix
        run: ./scripts/update-source-tool.py --tool gopls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate delve-versions.nix
        run: ./scripts/update-source-tool.py --tool delve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate staticcheck-versions.nix
        run: ./scripts/update-source-tool.py --tool staticcheck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          files="versions.nix golangci-lint-versions.nix goreleaser-versions.nix gofumpt-versions.nix govulncheck-versions.nix gopls-versions.nix delve-versions.nix staticcheck-versions.nix"
          if git diff --quiet -- $files; then
            echo "all version files are up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "chore: refresh upstream versions"
          git push

name: Update Go versions

on:
  schedule:
    - cron: "0 6 * * *"  # Daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate versions.nix
        run: ./scripts/update-versions.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- versions.nix; then
            echo "versions.nix is up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.nix
          git commit -m "chore: refresh Go versions from go.dev"
          git push
